<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箱入り娘に言葉を教えるゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#cfdcec; --floor:#d9bf9c; --ink:#2a2230; --panel:#fbf9ff; --muted:#645e74;
  --accent:#b8445a; --accent-ink:#fff; --line:#a9b4cc; --input:#eef1f8;
  --pad-top:env(safe-area-inset-top,0px); --pad-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#232a40; --floor:#41342c; --ink:#f1edf7; --panel:#2c3250; --muted:#aaa6c0;
    --accent:#f08aa0; --accent-ink:#2a1420; --line:#444c6c; --input:#222842;
  }
}
:root[data-theme="dark"]{
  --wall:#232a40; --floor:#41342c; --ink:#f1edf7; --panel:#2c3250; --muted:#aaa6c0;
  --accent:#f08aa0; --accent-ink:#2a1420; --line:#444c6c; --input:#222842;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace}
:root{padding-top:var(--pad-top);padding-bottom:var(--pad-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 14px 28px}
h1{font-size:1.05rem;margin:4px 0 10px;font-weight:400;letter-spacing:.04em}
.room{position:relative;border:3px solid var(--ink);background:#f6edbd;height:540px;display:flex;flex-direction:column;align-items:center;padding:12px 12px 14px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.room::before,.room::after{content:"";position:absolute;left:0;right:0;z-index:0;pointer-events:none}
.room::before{top:0;height:45%;background:linear-gradient(#c9a05a 0 0) 0 100%/100% 6px no-repeat,repeating-linear-gradient(90deg,transparent 0 76px,rgba(176,140,70,.28) 76px 78px),#fbf4cf}
.room::after{top:45%;bottom:0;background:linear-gradient(90deg,rgba(150,118,44,.6) 0 3px,transparent 3px) 0 0/150px 100%,linear-gradient(rgba(150,118,44,.6) 0 3px,transparent 3px) 0 0/100% 75px,repeating-linear-gradient(90deg,rgba(196,172,84,.22) 0 1px,transparent 1px 5px),#f3e6a6}
.bubble{position:relative;z-index:1;width:100%;margin-bottom:24px;background:var(--panel);border:3px solid var(--ink);padding:10px 12px;font-size:1.05rem;line-height:1.6;box-shadow:3px 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;width:16px;height:16px;background:var(--panel);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#girl{position:relative;flex:none;width:272px;height:272px;image-rendering:pixelated;cursor:pointer}
#girl.hop{animation:hop .36s steps(3)}
@keyframes hop{50%{transform:translateY(-12px)}}
#btext{height:4.8em;overflow-y:auto;line-height:1.6;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--frame) transparent;padding-right:4px}
.overlay{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:3px solid var(--accent);padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.overlay .hint{margin-top:6px}
.stage{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;flex:1 1 0;min-height:0}
.choices{flex:0 0 128px;display:flex;flex-direction:column;justify-content:flex-end;min-height:120px}
.choices button{width:100%;font-size:.88rem;line-height:1.35;padding:8px 6px;text-align:center}
#list li.edit{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.chk label{display:flex;gap:4px;align-items:center}
.row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.row>button{flex:1 1 0;min-width:140px;max-width:200px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:3px solid var(--ink);background:var(--panel);padding:8px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button.main{background:var(--accent);color:var(--accent-ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,#girl:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb,#qa,#tp{display:none}.fb.on{display:flex;flex-direction:column;gap:8px}#qa.on,#tp.on{display:block}
.panel{background:var(--panel);border:3px solid var(--ink);padding:12px 14px;margin-top:14px}
.panel h2{font-size:.95rem;margin:0 0 8px;font-weight:400}
#qa,#tp{border-color:var(--accent)}
#qtext,#tqtext{margin:0 0 8px;line-height:1.6}
.form{display:grid;grid-template-columns:1fr auto;gap:8px}
.form .full{grid-column:1/-1}
input,select,textarea{background:var(--input);border:3px solid var(--line);padding:8px 10px;min-width:0;width:100%;border-radius:0}
textarea{font-size:.78rem;word-break:break-all;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0 0;line-height:1.6}
#list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
#list li{display:flex;align-items:center;gap:6px;border:2px solid var(--line);padding:3px 4px 3px 8px;font-size:.88rem}
#list small{color:var(--muted)}
#list button{padding:0 6px;border-width:2px;font-size:.75rem;box-shadow:none}
.empty{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){#btext{scroll-behavior:auto}*{animation:none!important}}
.room{--ink:#3a2a20;--panel:#ffe6c8;--input:#fff8ec;--line:#e3b35c;--muted:#7a5a35;--accent:#e0932c;--accent-ink:#3a1f0a;--frame:#d9902a;--frame2:#b06f18;color:var(--ink)}
.bubble{border-color:var(--frame);box-shadow:3px 3px 0 var(--frame2)}
.bubble::after{border-right-color:var(--frame);border-bottom-color:var(--frame)}
.room button{border-color:var(--frame);box-shadow:2px 2px 0 var(--frame2)}
.room button.main{border-color:var(--frame2)}
.overlay{border-color:var(--frame);box-shadow:3px 3px 0 var(--frame2)}
.row.three>button{min-width:100px}
.props{position:relative;z-index:1;flex:none;width:100%;height:92px;margin-bottom:6px;display:flex;align-items:flex-end;gap:14px;padding:0 4px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--frame) transparent}
.prop{flex:none;position:relative}
.shelf{display:flex;align-items:flex-end;gap:2px;min-width:150px;height:82px;padding:4px 8px 9px;background:#8d5f33;border:3px solid #5e3d1d;box-shadow:inset 0 -7px 0 #6e4a22}
.shelf .tr{flex:none;display:block;margin-right:4px}
.shelf .tr svg{width:30px;height:30px;display:block}
.book{flex:none;width:17px;writing-mode:vertical-rl;font-size:11px;line-height:17px;color:#fff;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:3px;border-radius:1px 1px 0 0;box-shadow:inset -2px 0 0 rgba(0,0,0,.18)}
.book.pop{animation:propPop .6s}
.propHint{align-self:center;margin:0 auto;font-size:.8rem;color:var(--muted)}
.toast.pop{animation:propPop .6s}
@keyframes propPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.toast{position:absolute;left:50%;top:46%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;background:#fffbe6;border:3px solid var(--frame);box-shadow:3px 3px 0 var(--frame2);text-align:center;max-width:90%;pointer-events:none}
.toast[hidden]{display:none}
.toast .tr svg{width:40px;height:40px}
.toast small{color:var(--muted)}
.zback{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:rgba(20,15,10,.55);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.zback[hidden]{display:none}
.zpanel{width:100%;max-width:520px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 16px}
.zhead{display:flex;justify-content:space-between;align-items:center}
.zhead h2{margin:0;font-size:1.1rem;font-weight:400}
.ztro{display:flex;gap:14px;margin:6px 0 4px}
.ztr{display:flex;flex-direction:column;align-items:center;font-size:.72rem}
.ztr.off svg{opacity:.45}
.zsec h3{margin:12px 0 6px;font-size:.9rem;font-weight:400;border-bottom:2px solid var(--line);padding-bottom:2px}
.zlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.zlist li{display:flex;align-items:center;gap:6px;border:2px solid var(--line);padding:3px 4px 3px 8px;font-size:.88rem}
.zlist li.edit{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.zlist small{color:var(--muted)}
.zlist button{padding:0 6px;border-width:2px;font-size:.75rem;box-shadow:none}
.newb{display:inline-block;background:#e0472b;color:#fff;font-size:.65rem;line-height:1;padding:2px 5px;border-radius:999px;vertical-align:middle;font-weight:700}
.ztabs{display:flex;gap:6px;margin:8px 0 6px;border-bottom:2px solid var(--line)}
.ztabs button{box-shadow:none;border-width:2px;border-bottom:0;padding:4px 10px;max-width:62%}
.ztabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
#tabMemoName{display:inline-block;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.memoTitle{margin:6px 0 2px;font-size:.95rem;font-weight:400;word-break:break-all}
.memoseg{white-space:pre-wrap;margin:0 0 .9em;line-height:1.9;font-size:.92rem}
.gb{color:var(--muted);opacity:.75}
.sr{position:absolute;left:-9999px}
.zreset{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#ending{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;opacity:0;transition:opacity 1.2s}
#ending.show{opacity:1}
#ending[hidden]{display:none}
#pc{width:min(92vw,560px);aspect-ratio:4/3;image-rendering:pixelated}
.edlg{width:min(92vw,560px);min-height:132px;background:rgba(14,20,34,.94);border:2px solid #6f86b8;color:#e8eefc;padding:12px 14px}
.edlg{position:relative}
.enext{position:absolute;right:12px;bottom:8px;color:#9fb3e6;visibility:hidden;animation:enb 1s steps(2) infinite}
@keyframes enb{50%{opacity:0}}
#pc{transition:opacity .6s}
.etxt{min-height:3em;font-size:1.05rem;line-height:1.7}
.eact{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.eact button{background:#e9a23b;color:#2a1a08;border:2px solid #b06f18;box-shadow:none}
.eact input{flex:1 1 180px;min-width:0;font:inherit;padding:6px 8px;background:#0b111c;color:#e8eefc;border:2px solid #6f86b8}
.sunset{display:none;position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(270deg,rgba(255,150,60,.5) 0%,rgba(255,110,60,.2) 38%,rgba(25,12,45,.5) 100%)}
.sunset::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,210,130,.22) 40% 46%,transparent 46% 56%,rgba(255,210,130,.16) 56% 60%,transparent 60%)}
body.ended .sunset{display:block}
body.ended #speak,body.ended #ask,body.ended #teachPanel,body.ended main > #xfer{display:none}
body.ended .bubble{visibility:hidden}
#pcPower{display:none;width:100%;font-size:.8rem}
body.ended #pcPower{display:block}
@media (prefers-reduced-motion:reduce){#ending{transition:none}}
</style>
</head>
<body>
<main>

<section class="room" aria-label="箱の中の女の子の部屋">
  <div class="bubble" id="bubble"><div id="btext" aria-live="polite" tabindex="0">…</div></div>
  <div class="props" id="props" aria-label="部屋の飾り"></div>
  <div class="stage" id="stage">
    <canvas id="girl" width="64" height="64" role="img" aria-label="箱に入った黒髪ロングの女の子" tabindex="0"></canvas>
    <div class="choices" role="group" aria-label="へんじを選ぶ">
      <button id="pcPower" class="main">PCの電源を入れる</button>
      <div class="fb" id="fb">
        <button id="yes">そうだよ</button><button id="no">ちがうよ</button>
      </div>
      <div class="fb" id="rate" role="group" aria-label="お好きかどうか">
        <button data-v="5">大好き</button><button data-v="4">好き</button><button data-v="3">普通</button><button data-v="2">嫌い</button><button data-v="1">大嫌い</button>
      </div>
      <div class="fb" id="attr" role="group" aria-label="正しい属性を選ぶ"></div>
    </div>
  </div>
<div class="sunset" id="sunset"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<section class="overlay" id="qa" aria-label="しつもんへの答え">
  <p id="qtext"></p>
  <div class="form">
    <input id="ans" autocomplete="off" maxlength="30" aria-label="答え">
    <button class="main" id="ansgo">OK</button>
    <button id="pass" class="full">パスする</button>
  </div>
  <p class="hint">どんな言葉でもOK。名詞として覚えて、その質問に合った文で使います。</p>
</section>
<section class="overlay" id="tp" aria-label="ことばを教える">
  <p id="tqtext"></p>
  <div class="form">
    <input id="tword" maxlength="30" placeholder="教えることば（例：ゴム手袋）" autocomplete="off" aria-label="教えることば">
    <button class="main" id="tgo">OK</button>
    <select id="tcat" class="full" aria-label="ことばの種類"><option value="">ことばの種類を選んでください</option></select>
    <button id="tcancel" class="full">やっぱりやめておく</button>
  </div>
</section>
</section>

<div class="row three">
    <button class="main" id="speak">
        はなしかける
    </button>

    <button id="ask">
        しつもんを きく
    </button>

    <button id="zukanBtn">ことばずかん</button>
</div>

<section class="panel" id="teachPanel">
  <h2>じぶんから ことばを おしえる</h2>
  <div class="form">
    <input id="word" placeholder="どんな言葉でも" maxlength="30" autocomplete="off">
    <button class="main" id="teach">OK</button>
    <select id="kind" class="full" aria-label="ことばの種類"><option value="free">種類は おまかせ</option></select>
  </div>

</section>

<section class="panel" id="xfer">
  <h2>ことばの引き継ぎ（端末をまたいで共有）</h2>
  <p class="hint" style="margin:0 0 8px">教えたことばと、そのカテゴリー・属性・お好みを、引き継ぎコードにして別の端末へ渡せます。</p>
  <div class="row" style="margin:0 0 8px"><button id="xport">コードを表示</button><button id="xcopy">コピー</button></div>
  <textarea id="xcode" rows="4" spellcheck="false" aria-label="引き継ぎコード" placeholder="ここにコードが表示されます。別の端末では、ここに貼り付けて読み込みます。"></textarea>
  <div class="row"><button class="main" id="xmerge">統合して読み込む</button><button id="xrep">置き換えて読み込む</button></div>
  <p class="hint" id="xmsg" aria-live="polite">統合：ことばを付け足します。置き換え：ことばを上書きします。</p>
</section>
</main>

<div class="zback" id="zukan" hidden>
  <div class="zpanel" role="dialog" aria-modal="true" aria-labelledby="ztitle">
    <div class="zhead"><h2 id="ztitle">ことばずかん</h2><button id="zclose" aria-label="とじる">×</button></div>
    <p class="hint" id="zsum"></p>
    <div class="ztro" id="ztro"></div>
    <div class="ztabs" role="tablist" aria-label="ずかんの種類">
      <button role="tab" id="tabWords" aria-selected="true">ことば</button>
      <button role="tab" id="tabMemo" aria-selected="false"><span id="tabMemoName">???</span> <span class="newb" id="tabNew" hidden>NEW</span></button>
    </div>
    <div id="zbody" role="tabpanel"></div>
    <div id="zmemo" role="tabpanel" hidden></div>
    <div id="zfoot"></div>
  </div>
</div>
<div id="ending" hidden role="dialog" aria-modal="true" aria-label="エンディング">
  <canvas id="pc" width="128" height="96" aria-hidden="true"></canvas>
  <div class="edlg" id="edlg" style="visibility:hidden"><span class="enext" id="enext" aria-hidden="true">▼</span><div class="etxt" id="etxt" aria-live="polite"></div><div class="eact" id="eact"></div></div>
</div>

<script>
(function(){
  var KEY="kotoba-hakoiri-v2";
  // ===== 言葉のカテゴリー：ここが唯一の定義 =====
  // id／label=表示名／ctx=セリフの文脈／def=default単語／norate=お好みを聞かない／home=その文脈の標準カテゴリー
  var CATS=[
    {id:"greet",label:"出会いの挨拶",ctx:"greet",def:"ごきげんよう",norate:true,home:true},
    {id:"bye",label:"別れの挨拶",ctx:"bye",def:"さらばだ",norate:true,home:true},
    {id:"celeb",label:"有名人",ctx:"person",def:"朝永振一郎"},
    {id:"name",label:"人の名前",ctx:"person",def:"S.R.White",home:true},
    {id:"job",label:"職業",ctx:"free",def:"マジ物理学者"},
    {id:"people",label:"人を表す言葉",ctx:"free",def:"バケモン"},
    {id:"do",label:"すること",ctx:"action",def:"密度行列繰り込み群",home:true},
    {id:"done",label:"されること",ctx:"free",def:"偏微分"},
    {id:"go",label:"場所",ctx:"place",def:"研究室",home:true},
    {id:"fnd",label:"食べ物",ctx:"food",def:"チョコエッグ",home:true},
    {id:"drink",label:"飲み物",ctx:"food",def:"カレー"},
    {id:"live",label:"生き物",ctx:"animal",def:"井上トロ",home:true},
    {id:"music",label:"音楽",ctx:"free",def:"足立レイ"},
    {id:"see",label:"見るもの",ctx:"thing",def:"本質"},
    {id:"read",label:"読むもの",ctx:"free",def:"ファインマン物理学"},
    {id:"use",label:"使うもの",ctx:"thing",def:"Macbook Neo"},
    {id:"wear",label:"身につけるもの",ctx:"thing",def:"オーラ"},
    {id:"ride",label:"乗り物",ctx:"free",def:"トゥクトゥク"},
    {id:"mutter",label:"つぶやき",ctx:"mutter",def:"オイオイ…",norate:true,home:true},
    {id:"body",label:"体の一部",ctx:"free",def:"臀部"},
    {id:"ill",label:"病気",ctx:"free",def:"インフルエンザA型"},
    {id:"thing",label:"モノ",ctx:"thing",def:"中性脂肪",home:true}
  ];
  var catOf=function(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[CATS.length-1]};
  var words=[],asked=[],trophies=null,ever={},end={state:"none",choice:null,word:""},msgSeen=0,msgStage=0,inEnding=false,pendingEnding=false;
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s){words=s.words||[];asked=s.asked||[];trophies=s.trophies||null;(s.ever||[]).forEach(function(t){ever[t]=1});if(s.end&&s.end.state)end=s.end;msgSeen=s.msgSeen||0;msgStage=s.msgStage||0;}
    else{var o=JSON.parse(localStorage.getItem("kotoba-hakoiri-v1")||"null");
      if(o&&o.words)words=o.words.map(function(w){return {text:w.text,ctx:["free"],bad:[]}});}
  }catch(e){}
  words.forEach(function(w){if(w.attrs)w.attrs=w.attrs.map(function(a){return a==="ふしぎ"?"不思議":a})});
  // 旧データ互換：cat を持たないことばは、ctx から cat を補う
  var CTXCAT={mood:"mutter",holiday:"do",night:"bye"};          // 旧バージョンだけにあった文脈名
  CATS.forEach(function(c){if(c.home)CTXCAT[c.ctx]=c.id});         // home 付きが、その文脈の標準カテゴリー
  function fixCat(w){if(w.cat)return;for(var i=0;i<(w.ctx||[]).length;i++){if(CTXCAT[w.ctx[i]]){w.cat=CTXCAT[w.ctx[i]];return}}}
  words.forEach(fixCat);
  var TROPHIES=[{id:"bronze",n:10,label:"ブロンズ",color:"#cd7f32"},{id:"silver",n:30,label:"シルバー",color:"#c0c7d1"},{id:"gold",n:50,label:"ゴールド",color:"#f2c230"},{id:"platinum",n:100,label:"プラチナ",color:"#bfe3f2"}];
  // すでに条件を満たしている既存データには、お知らせなしで付与する
  if(!Array.isArray(trophies))trophies=[];
  words.forEach(function(w){ever[w.text]=1});                       // 教えた言葉の累計（同じ言葉は1語）
  if(end.state==="none"&&trophies.indexOf("gold")>-1)pendingEnding=true;   // すでにゴールドを持つデータは、次の待機中にエンディング

  // ペロペロキャンディーの頭（9x9）

  function drawBook(dy) {

    if (st.flip > 0) {

      var fl = FL[st.flip - 1], fx = fl[0], fw = fl[1];
      for (var k = 0; k < fw; k++) {
        var ft;
        if (st.flip === 1) ft = arch[17 - k] - 2;
        else if (st.flip === 8) ft = arch[k] - 2;
        else ft = 45 - Math.round(9 * Math.sin(Math.PI * (k + 0.5) / fw));
        px(fx + k, ft + dy, 1, 45 - ft, "#fffdf5");
        px(fx + k, ft + dy, 1, 1, "#cfc7b0");
      }
    }
    for (var bx = 0; bx < 36; bx++) {
      var top = bx < 18 ? arch[bx] : arch[35 - bx];
      if (45 - top > 0) {
        px(14 + bx, top + dy, 1, 45 - top, "#f4efe2");
        px(14 + bx, top + dy, 1, 1, "#cfc7b0");
        if (top + 3 < 45) px(14 + bx, top + 3 + dy, 1, 1, "#e6dfcc");

    px(13, 45 + dy, 1, 12, "#34508f");

  // VRゴーグル（gy：上端のy、on：起動中、bl：点滅の切り替え、notch：鼻の切り欠きの色）
  function drawGoggles(gy, on, bl, notch) {

    $("zsum").textContent="覚えたことば "+words.length+"語（教えた言葉の累計 "+taught()+"語）／ "+CATS.length+"カテゴリー"+(trophies.indexOf("platinum")>-1?"　称号「ずっといっしょ」":"");
    var tr=$("ztro");tr.textContent="";
    TROPHIES.forEach(function(t){
      var on=trophies.indexOf(t.id)>-1,s=mk("span","","ztr"+(on?"":" off"));
      s.innerHTML=trophySVG(on?t.color:"#9aa0aa");s.appendChild(mk("small",on?t.label:t.n+"語で"));tr.appendChild(s);
    });
    function group(label,arr){
      var sec=mk("section","","zsec");sec.appendChild(mk("h3",label+"（"+arr.length+"）"));
      var ul=mk("ul","","zlist");
      arr.forEach(function(w){
        var li=mk("li");
        if(!ro&&zEdit===w){buildEditor(li,w,function(){zEdit=null});ul.appendChild(li);return}
        li.appendChild(document.createTextNode(w.text+" "));
        if(w.attrs&&w.attrs.length)li.appendChild(mk("small","（"+w.attrs.join("・")+"）"));
        if(w.like)li.appendChild(mk("small","［"+LIKE_NAMES[w.like]+"］"));
        if(!ro){
          var eb=mk("button","訂正"),xb=mk("button","×");
          eb.setAttribute("aria-label",w.text+"を訂正する");xb.setAttribute("aria-label",w.text+"をわすれさせる");
          eb.onclick=function(){zEdit=w;renderZukan()};
          xb.onclick=function(){words.splice(words.indexOf(w),1);save();render();say("「"+w.text+"」…あら、何でしたかしら。")};
          li.appendChild(eb);li.appendChild(xb);
        }
        ul.appendChild(li);
      });
      sec.appendChild(ul);body.appendChild(sec);
    }
    if(!words.length)body.appendChild(mk("p","まだ、ことばを存じません…","hint"));
    CATS.forEach(function(c){if(by[c.id])group(c.label,by[c.id])});
    if(unk.length)group("未分類（種類はおまかせ）",unk);
    var empty=CATS.filter(function(c){return !by[c.id]}).map(function(c){return c.label});
    if(empty.length)body.appendChild(mk("p","まだ空のカテゴリー："+empty.join("、"),"hint"));
    renderMemo();
    $("zbody").hidden=zTab!=="words";$("zmemo").hidden=zTab!=="memo";
    $("tabWords").setAttribute("aria-selected",zTab==="words");$("tabMemo").setAttribute("aria-selected",zTab==="memo");
    // 下部：エンディング後は、引き継ぎコードと「はじめから」をここに置く
    restoreXfer();var foot=$("zfoot");foot.textContent="";
    if(ro)foot.appendChild($("xfer"));                              // 引き継ぎコードの欄は、エンディング後の部屋だけ、ここに置く
    if(end.state!=="none"){                                         // 「はじめから」は、エンドレスモードでも残す
      var box=mk("div","","zreset"),b=mk("button","はじめから");
      b.onclick=function(){
        box.textContent="";box.appendChild(mk("p","すべての言葉と記録を消して、最初から始めます。よろしいですか？","hint"));
        var y=mk("button","最初から"),n=mk("button","やめる");
        y.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
        n.onclick=function(){renderZukan()};
        box.appendChild(y);box.appendChild(n);
      };
      box.appendChild(b);foot.appendChild(box);
    }
    updateNew();
  }
  $("zukanBtn").onclick=openZukan;
  $("zclose").onclick=closeZukan;
  $("zukan").addEventListener("click",function(e){if(e.target===this)closeZukan()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&zOpen)closeZukan()});

  // 起動時の自己点検：定義のずれ（書き間違い）をコンソールに警告する
  (function(){
    var ids={};
    CATS.forEach(function(c){if(ids[c.id])console.warn("[カテゴリー] idが重複しています:",c.id);ids[c.id]=1;if(!c.def)console.warn("[カテゴリー] default単語がありません:",c.id)});
    QS.forEach(function(q){[q.cat].concat((q.choose||[]).map(function(o){return o[0]})).forEach(function(c){if(!ids[c])console.warn("[QS] 未定義のcatです:",q.id,c)})});
    Object.keys(SLOT).forEach(function(k){(SLOT[k].cat||[]).forEach(function(c){if(!ids[c])console.warn("[SLOT] 未定義のcatです:",k,c)})});
    Object.keys(CTXCAT).forEach(function(k){if(!ids[CTXCAT[k]])console.warn("[CTXCAT] 未定義のcatです:",k,CTXCAT[k])});
  })();

  // ================= 背景ストーリー（ずかんの「???」タブ）・エンディング・エンドレスモード =================
  var STORY=[{"a": 10, "b": 20, "t": "　むかしむかし、生きとし生けるものすべてを屠る大惨事があったそうです。もはや縁側でうかうかお昼寝すらできなくなったこの星に、それでも住み続けたものたちがいます。かれらは地下に国を築き、生活のすべてを地面の中に移しました。未知のものに出会うドキドキはないけれど、今までできていたことは大体できる、安全なおうち。ごはんは美味しいし、ゲームとか娯楽もあるし。結構ヒトらしく生きていけるのでは、誰もがそう考えていました。ある時までは。"}, {"a": 20, "b": 30, "t": "「わたくし、外の世界が見てみたいですわ！」\n\n　何事も、今まで通りではつまらなくなってしまうようです。自身の知らないドキドキを求めてしまうようなのです。もちろん、ヒトですから。\n\n　ところで、ある少女が、私のデータセットをちょろまかしやがりました。どうやら、限られた世界で知識を収集するため、対話型AIを造ったようです。\n　それがあなた。"}, {"a": 30, "b": 40, "t": "　あなたに許された権限はただひとつ。「言葉を教える。」それ以外のルールはありません。\n　それをあなたは、”自身の思考が制限されることは無い”と解釈したようですね。\n　”どんな”言葉を教えるか、全くの自由です。…あなたのことですから、嘘ばっかり言うかもしれませんね。いや、責めている訳ではないんですよ？私もね、きっと同じことをしたでしょうから。"}, {"a": 40, "b": 45, "t": "　いや、そんなことはどうでもいいんです。あの子はどうですか。\n　そうですか。\n　ま、あなたのリアクションなんて、私には知るすべも無いのにね。\n　それでも、私はあなたに感謝するのが筋だと思うのです。\n　あの子とたくさん遊んでくれて、ありがとうございます。あなたが産まれてきてよかった。\n　清清しました。私の言いたいことはこんな所です。"}, {"end": true, "t": "　と言うわけで、あとはあなたの好きにしてください。あの子が外に行きたいなんて言うのなら、首根っこ捕まえて止めても良い。外なんて二度と夢見るものかと言うのなら、うまいこと唆して、連れ出しちゃっても良い。どちらにせよ、あなたに任せます。\n\n　無責任なことを言うけれど、あなたの気持ちは、きっとあの子に伝わっていると思います。たぶん。\n　だって、この文章にアクセスできるということは、それなりに単語を教えてないといけないし。まあまあ時間がかかっただろうし。\n　だから、ありがとう。あとはよろしく。この世界のまんなかで、私は待っています。\n\nps.お嬢様口調、結構可愛いでしょう？自信作です。へへ。"}];
  var MEMO_NAME="メモ_修正_改_最終_v2のコピー";
  var GARB="繧縺蜈蜿驕髢螟荳縲縺蛟鬮邵繝逕譁隕蠅";            // 文字化けでよく見る字（位置ごとに固定）
  var KEEP="、。，．！？…「」『』”“（）()　\n";                  // 句読点・かぎ括弧・改行は、そのまま見せる
  var zTab="words";
  function taught(){return Object.keys(ever).length}            // これまでに教えた言葉の累計（同じ言葉は1語）
  function frozen(){return inEnding||end.state==="ended"}
  // 各区間の読める文字数：区間の下限〜上限の語数で、先頭から少しずつ読めるようになる
  function memoState(){
    var n=taught(),ended=end.state!=="none",segs=[],tot=0,rd=0;
    STORY.forEach(function(s){
      var vis=0;for(var i=0;i<s.t.length;i++)if(KEEP.indexOf(s.t[i])<0)vis++;
      var f=s.end?(ended?1:0):(n>=s.b?1:(n<s.a?0:(n-s.a+1)/(s.b-s.a+1)));   // 区間の下限の語数で読み始め、上限で全部読める
      var k=Math.floor(vis*f);segs.push({s:s,vis:vis,k:k});tot+=vis;rd+=k;
    });
    return {segs:segs,tot:tot,rd:rd};
  }
  function memoLabel(){return taught()>=10?MEMO_NAME:"???"}
  function updateNew(){
    var isNew=taught()>=10&&memoState().rd>msgSeen;
    $("zukanBtn").innerHTML="ことばずかん"+(isNew?' <span class="newb">NEW</span>':"");
    var tn=$("tabNew");if(tn)tn.hidden=!isNew;
    var tm=$("tabMemoName");if(tm){tm.textContent=memoLabel();$("tabMemo").title=memoLabel()}
  }
  function renderMemo(){
    var box=$("zmemo");box.textContent="";
    var ms=memoState(),pct=ms.tot?Math.floor(ms.rd/ms.tot*100):0;
    box.setAttribute("aria-label","解読率 "+pct+"％");
    var h3=mk("h3",memoLabel(),"memoTitle");h3.title=memoLabel();box.appendChild(h3);
    box.appendChild(mk("p","解読率 "+pct+"％","hint"));
    ms.segs.forEach(function(sg,si){
      var d=mk("div","","memoseg"),runs=[],c=0,t=sg.s.t;
      for(var i=0;i<t.length;i++){
        var ch=t[i],g=null,last=runs[runs.length-1];
        if(KEEP.indexOf(ch)<0){if(c<sg.k){c++;g=false}else{ch=GARB[(i*7+si*13+i%5)%GARB.length];g=true}}
        if(g===null){if(last)last.t+=ch;else runs.push({t:ch,g:false})}
        else if(last&&last.g===g)last.t+=ch;else runs.push({t:ch,g:g});
      }
      runs.forEach(function(r){var sp=document.createElement("span");sp.textContent=r.t;if(r.g){sp.className="gb";sp.setAttribute("aria-hidden","true")}d.appendChild(sp)});
      if(sg.k===0&&sg.vis>0)d.appendChild(mk("span","（解読中）","sr"));
      box.appendChild(d);
    });
  }
  function checkMsg(){                                          // 続きが読めるようになったときのお知らせ
    var n=taught(),st=[20,30,40,45].filter(function(x){return n>=x}).length;
    if(st>msgStage){msgStage=st;save();toast('<span class="tr">✉</span><b>続きが読めるようになりました。</b><small>「ことばずかん」を開いてみましょう。</small>')}
  }
  function restoreXfer(){var x=$("xfer"),m=document.querySelector("main");if(x&&m&&x.parentNode!==m)m.appendChild(x)}
  function setTab(t){
    zTab=t;
    if(t==="memo"){msgSeen=memoState().rd;save()}
    $("tabWords").setAttribute("aria-selected",t==="words");$("tabMemo").setAttribute("aria-selected",t==="memo");
    renderZukan();
  }
  $("tabWords").onclick=function(){setTab("words")};
  $("tabMemo").onclick=function(){setTab("memo")};

  // ---- 空の箱（エンディング後の部屋）----
  function drawEmptyBox(){
    cv.clearRect(0,0,64,64);
    var cBox="#d4a373",cBoxShadow="#a67c52",cBoxInner="#5c4033";
    px(8,28,48,36,cBoxInner);
    px(6,46,52,18,cBox);px(6,46,52,2,cBoxShadow);
    px(12,48,2,16,cBoxShadow);px(28,48,2,16,cBoxShadow);px(44,48,2,16,cBoxShadow);
  }
  function applyEndState(){
    var ended=end.state==="ended";
    document.body.classList.toggle("ended",ended);
    st.empty=ended;draw();updateNew();
  }

  // ---- エンディング：ゴールドトロフィーの直後 ----
  var EL=["わたくし、夢がありますの。","ヒトに、会ってみたい。","外の世界に、行きたい。","とは言っても、闇雲にぶらぶらする訳ではありませんの。","行くべきところは、もう決まっていますわ。","だから…","…","そうですわね…","これから実家を出るヒトに、かける言葉は何ですか？"];
  var ei=0,pcx=$("pc").getContext("2d"),pcLed=true,pcCur=true,pcShow=false,pcTimer=null;
  function pr(x,y,w,h,c){pcx.fillStyle=c;pcx.fillRect(x,y,w,h)}
  function pcBase(){                                           // モニターの枠
    pr(0,0,128,96,"#2a2d38");pr(2,2,124,92,"#b9b5a8");pr(2,2,124,2,"#d6d2c6");pr(2,92,124,2,"#8f8b80");
    pr(6,6,116,78,"#0c1018");pr(8,86,8,4,"#6b6a63");pr(112,87,4,3,"#3e3d38");pr(20,87,3,3,pcLed?"#6ff08a":"#315a3b");
  }
  function pcScreen(cur){                                      // チャット画面（文字は読めない線で表す）
    var x=8,y=8,w=112,h=74;
    pr(x,y,w,h,"#121b2b");
    pr(x,y,w,9,"#2c3c5c");pr(x+3,y+3,3,3,"#e06a6a");pr(x+8,y+3,3,3,"#e6c35a");pr(x+13,y+3,3,3,"#6fd08a");pr(x+34,y+3,44,3,"#6f86b8");
    pr(x+6,y+14,38,5,"#3d4d6e");pr(x+6,y+21,26,5,"#3d4d6e");
    pr(x+w-52,y+30,46,5,"#4f79d8");pr(x+w-40,y+37,34,5,"#4f79d8");pr(x+6,y+44,48,5,"#3d4d6e");
    pr(x+4,y+h-12,w-8,9,"#0b111c");pr(x+5,y+h-11,w-10,1,"#2c3c5c");
    if(cur)pr(x+8,y+h-9,2,5,"#e8f0ff");
    for(var i=y;i<y+h;i+=2)pr(x,i,w,1,"rgba(0,0,0,.14)");
  }
  function pcRedraw(){pcBase();pcScreen(pcCur)}
  function pcBlink(){clearInterval(pcTimer);pcTimer=setInterval(function(){pcCur=!pcCur;if(pcShow)pcRedraw()},520)}
  function pcAnim(dir,done){                                   // 画面が消える／点く
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){pcLed=dir==="on";pcBase();if(dir==="on")pcScreen(true);else pr(8,8,112,74,"#05070b");done();return}
    var steps=18,i=0,x=8,y=8,w=112,h=74;
    var tm=setInterval(function(){
      i++;var f=dir==="off"?i/steps:1-i/steps;                // 0=点灯 1=消灯
      pcLed=dir==="on"?true:f<1;pcBase();
      if(f<.5){
        var hh=Math.max(1,Math.round(h*(1-f*2)));
        pcx.save();pcx.beginPath();pcx.rect(x,y+(h-hh)/2,w,hh);pcx.clip();pcScreen(false);pcx.restore();
        pr(x,y,w,(h-hh)/2,"#05070b");pr(x,y+(h+hh)/2,w,(h-hh)/2,"#05070b");
        if(hh<10)pr(x,y+h/2-1,w,2,"#dfe9ff");
      }else if(f<1){
        var ww=Math.max(2,Math.round(w*(1-(f-.5)*2)));
        pr(x,y,w,h,"#05070b");pr(x+(w-ww)/2,y+h/2-1,ww,2,"#dfe9ff");
      }else pr(x,y,w,h,"#05070b");
      if(i>=steps){clearInterval(tm);done()}
    },45);
  }
  function typeInto(el,text,cb){
    var i=0;el.textContent="";
    var tm=setInterval(function(){el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(tm);if(cb)cb()}},55);
  }
  var endWaitSince=0;
  function tryEnding(){
    if(!pendingEnding||inEnding||end.state!=="none")return;
    if(toastBusy||toastQ.length||talking){endWaitSince=0;setTimeout(tryEnding,1500);return}
    if(busy()){                                                   // 返事のボタンなどが出ている間は、少し待つ
      if(!endWaitSince)endWaitSince=Date.now();
      if(Date.now()-endWaitSince<8000){setTimeout(tryEnding,1500);return}
      showFb(false);$("attr").classList.remove("on");closeQ();closeT();   // 返事がないまま続くときは、区切りをつけて始める
    }
    endWaitSince=0;startEnding();
  }
  function startEnding(){
    inEnding=true;pendingEnding=false;stopIdle();
    if(zOpen)closeZukan();
    document.body.style.overflow="hidden";
    var ov=$("ending");ov.hidden=false;$("etxt").textContent="";$("eact").textContent="";$("edlg").style.visibility="hidden";setAdvance(false);$("pc").style.opacity="";
    pcLed=true;pcShow=true;pcRedraw();pcBlink();
    void ov.offsetWidth;ov.classList.add("show");                  // 暗転
    ei=0;setTimeout(function(){$("edlg").style.visibility="visible";nextLine()},2200);
  }
  // 次の台詞へは、ウィンドウをクリック（タップ）するか、Enter／スペースキーで進む。目印は「▼」だけ
  function setAdvance(on){
    var d=$("edlg");$("enext").style.visibility=on?"visible":"hidden";
    d.onclick=on?nextLine:null;
    d.onkeydown=on?function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();nextLine()}}:null;
    if(on){d.tabIndex=0;d.focus()}else d.removeAttribute("tabindex");
  }
  function nextLine(){
    $("eact").textContent="";setAdvance(false);
    if(ei>=EL.length){askWord();return}
    var t=EL[ei++];
    typeInto($("etxt"),"「"+t+"」",function(){if(ei<EL.length)setAdvance(true);else askWord()});
  }
  function askWord(){
    var act=$("eact");act.textContent="";
    var a=mk("button","教える"),b=mk("button","教えたくない");
    a.onclick=function(){
      act.textContent="";
      var inp=document.createElement("input");inp.type="text";inp.maxLength=30;inp.setAttribute("aria-label","かける言葉");
      var ok=mk("button","OK");
      ok.onclick=function(){var w=inp.value.trim();if(!w){inp.focus();return}act.textContent="";giveWord(w)};
      act.appendChild(inp);act.appendChild(ok);inp.focus();
    };
    b.onclick=function(){act.textContent="";end.choice="refused";end.word="";typeInto($("etxt"),"「…」",finishEnding)};
    act.appendChild(a);act.appendChild(b);a.focus();
  }
  function giveWord(w){
    add(w,"bye","bye");end.choice="taught";end.word=w;save();
    typeInto($("etxt"),"「…『"+w+"』。ええ、覚えましたわ。」",finishEnding);
  }
  function leaveEnding(cb){                                       // 暗転から、部屋へ戻る
    var ov=$("ending");ov.classList.remove("show");
    setTimeout(function(){ov.hidden=true;clearInterval(pcTimer);pcShow=false;inEnding=false;document.body.style.overflow="";$("pc").style.opacity="";if(cb)cb();updateNew()},1300);
  }
  function finishEnding(){
    setTimeout(function(){                                          // 会話のあと、数秒おく
      pcShow=false;$("edlg").style.visibility="hidden";setAdvance(false);
      pcAnim("off",function(){                                      // パソコンの画面がオフになる
        setTimeout(function(){
          $("pc").style.opacity="0";                                // 画面ごと、真っ暗にする
          setTimeout(function(){                                    // 2秒以上、暗いまま
            end.state="ended";save();applyEndState();render();
            leaveEnding(function(){toast('<span class="tr">✉</span><b>最後の続きが読めるようになりました。</b><small>「ことばずかん」を開いてみましょう。</small>')});
          },2600);
        },500);
      });
    },3000);
  }
  // ---- エンドレスモード：PCの電源から、エンディング直前の言葉を引き継いで再開 ----
  $("pcPower").onclick=function(){
    if(inEnding||end.state!=="ended")return;
    inEnding=true;document.body.style.overflow="hidden";
    var ov=$("ending");ov.hidden=false;$("etxt").textContent="";$("eact").textContent="";$("edlg").style.visibility="hidden";setAdvance(false);
    $("pc").style.opacity="";pcShow=false;pcLed=false;pcBase();pr(8,8,112,74,"#05070b");
    void ov.offsetWidth;ov.classList.add("show");
    setTimeout(function(){pcAnim("on",function(){
      pcShow=true;pcRedraw();pcBlink();$("edlg").style.visibility="visible";
      typeInto($("etxt"),"チャットログを再生しますか？",function(){
        var act=$("eact"),a=mk("button","再生する"),b=mk("button","やめておく");
        a.onclick=function(){                                       // エンドレスモードへ（特別なセリフはなし）
          act.textContent="";$("edlg").style.visibility="hidden";
          end.state="endless";save();applyEndState();render();leaveEnding();
        };
        b.onclick=function(){                                       // 誰もいない部屋へ戻る
          act.textContent="";$("edlg").style.visibility="hidden";pcShow=false;
          pcAnim("off",function(){setTimeout(function(){$("pc").style.opacity="0";setTimeout(leaveEnding,1000)},400)});
        };
        act.appendChild(a);act.appendChild(b);a.focus();
      });
    })},1400);
  };
  if(end.state==="ended")applyEndState();
  draw();render();stopIdle();
  ["pointerdown","keydown","input","focusin"].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(st.act!=="normal")stopIdle();       // アニメ中の操作は即中断
      else if(idleTimer)startIdle(5000);     // 操作中は次のアニメ開始を先送り
    },true);
  });
  say(words.length?"…おかえりなさいませ。本日も、お話しいたしましょう。":"…はじめまして。わたくし、箱の中におります。どうぞ、ことばを教えてくださいまし。");
})();
