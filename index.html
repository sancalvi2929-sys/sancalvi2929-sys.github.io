<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箱入り娘に言葉を教えるゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#cfdcec; --floor:#d9bf9c; --ink:#2a2230; --panel:#fbf9ff; --muted:#645e74;
  --accent:#b8445a; --accent-ink:#fff; --line:#a9b4cc; --input:#eef1f8;
  --pad-top:env(safe-area-inset-top,0px); --pad-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#232a40; --floor:#41342c; --ink:#f1edf7; --panel:#2c3250; --muted:#aaa6c0;
    --accent:#f08aa0; --accent-ink:#2a1420; --line:#444c6c; --input:#222842;
  }
}
:root[data-theme="dark"]{
  --wall:#232a40; --floor:#41342c; --ink:#f1edf7; --panel:#2c3250; --muted:#aaa6c0;
  --accent:#f08aa0; --accent-ink:#2a1420; --line:#444c6c; --input:#222842;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace}
:root{padding-top:var(--pad-top);padding-bottom:var(--pad-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 14px 28px}
h1{font-size:1.05rem;margin:4px 0 10px;font-weight:400;letter-spacing:.04em}
.room{position:relative;border:3px solid var(--ink);background:#f6edbd;height:540px;display:flex;flex-direction:column;align-items:center;padding:12px 12px 14px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.room::before,.room::after{content:"";position:absolute;left:0;right:0;z-index:0;pointer-events:none}
.room::before{top:0;height:45%;background:linear-gradient(#c9a05a 0 0) 0 100%/100% 6px no-repeat,repeating-linear-gradient(90deg,transparent 0 76px,rgba(176,140,70,.28) 76px 78px),#fbf4cf}
.room::after{top:45%;bottom:0;background:linear-gradient(90deg,rgba(150,118,44,.6) 0 3px,transparent 3px) 0 0/150px 100%,linear-gradient(rgba(150,118,44,.6) 0 3px,transparent 3px) 0 0/100% 75px,repeating-linear-gradient(90deg,rgba(196,172,84,.22) 0 1px,transparent 1px 5px),#f3e6a6}
.bubble{position:relative;z-index:1;width:100%;margin-bottom:24px;background:var(--panel);border:3px solid var(--ink);padding:10px 12px;font-size:1.05rem;line-height:1.6;box-shadow:3px 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;width:16px;height:16px;background:var(--panel);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#girl{position:relative;flex:none;width:272px;height:272px;image-rendering:pixelated;cursor:pointer}
#girl.hop{animation:hop .36s steps(3)}
@keyframes hop{50%{transform:translateY(-12px)}}
#btext{height:4.8em;overflow-y:auto;line-height:1.6;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--frame) transparent;padding-right:4px}
.overlay{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:3px solid var(--accent);padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.overlay .hint{margin-top:6px}
.stage{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;flex:1 1 0;min-height:0}
.choices{flex:0 0 128px;display:flex;flex-direction:column;justify-content:flex-end;min-height:120px}
.choices button{width:100%;font-size:.88rem;line-height:1.35;padding:8px 6px;text-align:center}
#list li.edit{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.chk label{display:flex;gap:4px;align-items:center}
.row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.row>button{flex:1 1 0;min-width:140px;max-width:200px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:3px solid var(--ink);background:var(--panel);padding:8px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button.main{background:var(--accent);color:var(--accent-ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,#girl:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb,#qa,#tp{display:none}.fb.on{display:flex;flex-direction:column;gap:8px}#qa.on,#tp.on{display:block}
.panel{background:var(--panel);border:3px solid var(--ink);padding:12px 14px;margin-top:14px}
.panel h2{font-size:.95rem;margin:0 0 8px;font-weight:400}
#qa,#tp{border-color:var(--accent)}
#qtext,#tqtext{margin:0 0 8px;line-height:1.6}
.form{display:grid;grid-template-columns:1fr auto;gap:8px}
.form .full{grid-column:1/-1}
input,select,textarea{background:var(--input);border:3px solid var(--line);padding:8px 10px;min-width:0;width:100%;border-radius:0}
textarea{font-size:.78rem;word-break:break-all;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0 0;line-height:1.6}
#list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
#list li{display:flex;align-items:center;gap:6px;border:2px solid var(--line);padding:3px 4px 3px 8px;font-size:.88rem}
#list small{color:var(--muted)}
#list button{padding:0 6px;border-width:2px;font-size:.75rem;box-shadow:none}
.empty{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){#btext{scroll-behavior:auto}*{animation:none!important}}
.room{--ink:#3a2a20;--panel:#ffe6c8;--input:#fff8ec;--line:#e3b35c;--muted:#7a5a35;--accent:#e0932c;--accent-ink:#3a1f0a;--frame:#d9902a;--frame2:#b06f18;color:var(--ink)}
.bubble{border-color:var(--frame);box-shadow:3px 3px 0 var(--frame2)}
.bubble::after{border-right-color:var(--frame);border-bottom-color:var(--frame)}
.room button{border-color:var(--frame);box-shadow:2px 2px 0 var(--frame2)}
.room button.main{border-color:var(--frame2)}
.overlay{border-color:var(--frame);box-shadow:3px 3px 0 var(--frame2)}
.row.three>button{min-width:100px}
.props{position:relative;z-index:1;flex:none;width:100%;height:92px;margin-bottom:6px;display:flex;align-items:flex-end;gap:14px;padding:0 4px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--frame) transparent}
.prop{flex:none;position:relative}
.shelf{display:flex;align-items:flex-end;gap:2px;min-width:150px;height:82px;padding:4px 8px 9px;background:#8d5f33;border:3px solid #5e3d1d;box-shadow:inset 0 -7px 0 #6e4a22}
.shelf .tr{flex:none;display:block;margin-right:4px}
.shelf .tr svg{width:30px;height:30px;display:block}
.book{flex:none;width:17px;writing-mode:vertical-rl;font-size:11px;line-height:17px;color:#fff;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:3px;border-radius:1px 1px 0 0;box-shadow:inset -2px 0 0 rgba(0,0,0,.18)}
.book.pop{animation:propPop .6s}
.propHint{align-self:center;margin:0 auto;font-size:.8rem;color:var(--muted)}
.toast.pop{animation:propPop .6s}
@keyframes propPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.toast{position:absolute;left:50%;top:46%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;background:#fffbe6;border:3px solid var(--frame);box-shadow:3px 3px 0 var(--frame2);text-align:center;max-width:90%;pointer-events:none}
.toast[hidden]{display:none}
.toast .tr svg{width:40px;height:40px}
.toast small{color:var(--muted)}
.zback{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:rgba(20,15,10,.55);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.zback[hidden]{display:none}
.zpanel{width:100%;max-width:520px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 16px}
.zhead{display:flex;justify-content:space-between;align-items:center}
.zhead h2{margin:0;font-size:1.1rem;font-weight:400}
.ztro{display:flex;gap:14px;margin:6px 0 4px}
.ztr{display:flex;flex-direction:column;align-items:center;font-size:.72rem}
.ztr.off svg{opacity:.45}
.zsec h3{margin:12px 0 6px;font-size:.9rem;font-weight:400;border-bottom:2px solid var(--line);padding-bottom:2px}
.zlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.zlist li{display:flex;align-items:center;gap:6px;border:2px solid var(--line);padding:3px 4px 3px 8px;font-size:.88rem}
.zlist li.edit{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.zlist small{color:var(--muted)}
.zlist button{padding:0 6px;border-width:2px;font-size:.75rem;box-shadow:none}
</style>
</head>
<body>
<main>

<section class="room" aria-label="箱の中の女の子の部屋">
  <div class="bubble" id="bubble"><div id="btext" aria-live="polite" tabindex="0">…</div></div>
  <div class="props" id="props" aria-label="部屋の飾り"></div>
  <div class="stage" id="stage">
    <canvas id="girl" width="64" height="64" role="img" aria-label="箱に入った黒髪ロングの女の子" tabindex="0"></canvas>
    <div class="choices" role="group" aria-label="へんじを選ぶ">
      <div class="fb" id="fb">
        <button id="yes">そうだよ</button><button id="no">ちがうよ</button>
      </div>
      <div class="fb" id="rate" role="group" aria-label="お好きかどうか">
        <button data-v="5">大好き</button><button data-v="4">好き</button><button data-v="3">普通</button><button data-v="2">嫌い</button><button data-v="1">大嫌い</button>
      </div>
      <div class="fb" id="attr" role="group" aria-label="正しい属性を選ぶ"></div>
    </div>
  </div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<section class="overlay" id="qa" aria-label="しつもんへの答え">
  <p id="qtext"></p>
  <div class="form">
    <input id="ans" autocomplete="off" maxlength="30" aria-label="答え">
    <button class="main" id="ansgo">OK</button>
    <button id="pass" class="full">パスする</button>
  </div>
  <p class="hint">どんな言葉でもOK。名詞として覚えて、その質問に合った文で使います。</p>
</section>
<section class="overlay" id="tp" aria-label="ことばを教える">
  <p id="tqtext"></p>
  <div class="form">
    <input id="tword" maxlength="30" placeholder="教えることば（例：ゴム手袋）" autocomplete="off" aria-label="教えることば">
    <button class="main" id="tgo">OK</button>
    <select id="tcat" class="full" aria-label="ことばの種類"><option value="">ことばの種類を選んでください</option></select>
    <button id="tcancel" class="full">やっぱりやめておく</button>
  </div>
</section>
</section>

<div class="row three">
    <button class="main" id="speak">
        はなしかける
    </button>

    <button id="ask">
        しつもんを きく
    </button>

    <button id="zukanBtn">ことばずかん</button>
</div>

<section class="panel">
  <h2>じぶんから ことばを おしえる</h2>
  <div class="form">
    <input id="word" placeholder="どんな言葉でも" maxlength="30" autocomplete="off">
    <button class="main" id="teach">OK</button>
    <select id="kind" class="full" aria-label="ことばの種類"><option value="free">種類は おまかせ</option></select>
  </div>

</section>

<section class="panel">
  <h2>ことばの引き継ぎ（端末をまたいで共有）</h2>
  <p class="hint" style="margin:0 0 8px">教えたことばと、そのカテゴリー・属性・お好みを、引き継ぎコードにして別の端末へ渡せます。</p>
  <div class="row" style="margin:0 0 8px"><button id="xport">コードを表示</button><button id="xcopy">コピー</button></div>
  <textarea id="xcode" rows="4" spellcheck="false" aria-label="引き継ぎコード" placeholder="ここにコードが表示されます。別の端末では、ここに貼り付けて読み込みます。"></textarea>
  <div class="row"><button class="main" id="xmerge">統合して読み込む</button><button id="xrep">置き換えて読み込む</button></div>
  <p class="hint" id="xmsg" aria-live="polite">統合：ことばを付け足します。置き換え：ことばを上書きします。</p>
</section>
</main>

<div class="zback" id="zukan" hidden>
  <div class="zpanel" role="dialog" aria-modal="true" aria-labelledby="ztitle">
    <div class="zhead"><h2 id="ztitle">ことばずかん</h2><button id="zclose" aria-label="とじる">×</button></div>
    <p class="hint" id="zsum"></p>
    <div class="ztro" id="ztro"></div>
    <div id="zbody"></div>
  </div>
</div>

<script>
(function(){
  var KEY="kotoba-hakoiri-v2";
  var words=[],asked=[],trophies=null;
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s){words=s.words||[];asked=s.asked||[];trophies=s.trophies||null;}
    else{var o=JSON.parse(localStorage.getItem("kotoba-hakoiri-v1")||"null");
      if(o&&o.words)words=o.words.map(function(w){return {text:w.text,ctx:["free"],bad:[]}});}
  }catch(e){}
  words.forEach(function(w){if(w.attrs)w.attrs=w.attrs.map(function(a){return a==="ふしぎ"?"不思議":a})});
  // 旧データ互換：cat を持たないことばは、ctx から cat を補う
  var CTXCAT={food:"fnd",animal:"live",greet:"greet",mood:"mutter",holiday:"do",action:"do",place:"go",night:"bye",bye:"bye",person:"name",thing:"thing"};
  function fixCat(w){if(w.cat)return;for(var i=0;i<(w.ctx||[]).length;i++){if(CTXCAT[w.ctx[i]]){w.cat=CTXCAT[w.ctx[i]];return}}}
  words.forEach(fixCat);
  var TROPHIES=[{id:"bronze",n:10,label:"ブロンズ",color:"#cd7f32"},{id:"silver",n:50,label:"シルバー",color:"#c0c7d1"},{id:"gold",n:100,label:"ゴールド",color:"#f2c230"}];
  // すでに条件を満たしている既存データには、お知らせなしで付与する
  if(!Array.isArray(trophies))trophies=TROPHIES.filter(function(t){return words.length>=t.n}).map(function(t){return t.id});
  function save(){try{localStorage.setItem(KEY,JSON.stringify({words:words,asked:asked,trophies:trophies}));}catch(e){}}
  var $=function(i){return document.getElementById(i)};
  var bubble=$("bubble"),girl=$("girl"),fb=$("fb"),timer=null,last=null,pend=null;

// ---------- ドット絵 ----------
  var cv = girl.getContext("2d");
  var st = {
    mood: "normal",
    mouth: "closed",
    act: "normal", // pc, book, doze, think, sneeze, float
    sn: 0,         // くしゃみの段階 1:吸う 2:くしゅん 3:余韻
    lift: 0,       // 浮遊の高さ(px)
    t: 0           // きらめきの時間
  };

  function px(x, y, w, h, c) {
    cv.fillStyle = c;
    cv.fillRect(x, y, w, h);
  }

  function draw() {
    cv.clearRect(0, 0, 64, 64);
    var lift = (st.act === "float") ? (st.lift || 0) : 0;
    if (st.act === "float") {           // 足もとの影（高く浮くほど小さく薄く）
      var sw = 40 - lift * 2;
      cv.fillStyle = "rgba(70,45,20,0.22)";
      cv.fillRect(32 - sw / 2, 62, sw, 2);
      cv.fillRect(32 - (sw - 6) / 2, 61, sw - 6, 1);
    }
    cv.save(); cv.translate(0, -lift);
    var o = 0;
    
    // 居眠り中も少し頭が下がる
    if (st.mood === "sleepy" || st.act === "doze") o = 1;
    if (st.mood === "surprise") o = -1;
    if (st.act === "sneeze") o = (st.sn === 1) ? -1 : (st.sn === 2 ? 2 : 1);

    var cBox = "#d4a373", cBoxShadow = "#a67c52", cBoxInner = "#5c4033";
    var cSkin = "#fff0e6", cSkinShadow = "#ffdac4", cBlush = "#ffa6b8";
    var cHair = "#2c2a38", cHairLight = "#56526e";
    var cEye = "#5a3148", cEyeWhite = "#ffffff", cEyeHigh = "#ffe6ec";
    var cClothes = "#f8f9fa", cClothesShadow = "#dee2e6", cRibbon = "#d94a64";

    // --- 箱の内側 ---
    px(8, 28, 48, 36, cBoxInner);

    // --- 後ろ髪 ---
    px(14, 10, 36, 42, cHair);
    px(12, 22, 40, 24, cHair);

    // --- 体と服 ---
    px(22, 40 + o, 20, 10, cClothes);
    px(24, 41 + o, 16, 9, cClothesShadow);
    px(28, 41 + o, 8, 4, cSkinShadow);
    px(27, 44 + o, 10, 3, cRibbon);

    // --- 顔の輪郭 ---
    px(17, 18 + o, 30, 20, cSkin); 
    px(16, 20 + o, 32, 16, cSkin); 
    px(18, 38 + o, 28, 3, cSkin);  
    px(20, 41 + o, 24, 2, cSkin);  

    // --- 目 ---
    var shut = (st.mood === "blink" || st.mood === "sleepy" || st.act === "doze" || st.act === "float" || (st.act === "sneeze" && st.sn >= 2));
    var eyeH = shut ? 2 : 9;
    var eyeY = shut ? 28 : 23;
    if (st.act === "sneeze" && st.sn === 1) { eyeY = 25; eyeH = 5; }   // 息を吸い込む：目を細める

    if (st.mood === "think" || st.act === "think") { eyeY = 22; eyeH = 7; }
    if (st.mood === "surprise") { eyeY = 21; eyeH = 10; }

    if (st.mood === "happy") {
      px(20, 25 + o, 8, 3, cEye); px(36, 25 + o, 8, 3, cEye);
      px(20, 27 + o, 8, 2, cSkin); px(36, 27 + o, 8, 2, cSkin);
      px(19, 27 + o, 2, 2, cEye); px(27, 27 + o, 2, 2, cEye);
      px(35, 27 + o, 2, 2, cEye); px(43, 27 + o, 2, 2, cEye);
    } else {
      px(20, eyeY + o, 8, eyeH, cEye);
      px(36, eyeY + o, 8, eyeH, cEye);
      if (eyeH > 2) {
        px(20, eyeY + o + 1, 2, eyeH - 2, cEyeWhite);
        px(36, eyeY + o + 1, 2, eyeH - 2, cEyeWhite);
        px(24, eyeY + o + 1, 3, 4, cEyeHigh);
        px(40, eyeY + o + 1, 3, 4, cEyeHigh);
        px(22, eyeY + o + 6, 2, 2, cEyeHigh);
        px(38, eyeY + o + 6, 2, 2, cEyeHigh);
      }
    }

    // --- チーク ---
    px(17, 29 + o, 4, 3, cBlush);
    px(43, 29 + o, 4, 3, cBlush);

    // --- 口 ---
    if (st.act === "sneeze" && st.sn === 2) {
      px(28, 33 + o, 8, 6, "#b05a5a");
      px(30, 36 + o, 4, 3, "#e68585");
    } else if (st.mouth === "open" || st.mood === "surprise" || st.mood === "happy" || (st.act === "sneeze" && st.sn === 1)) {
      px(30, 33 + o, 4, 4, "#b05a5a");
      px(31, 35 + o, 2, 2, "#e68585"); 
    } else if (st.mood === "think" || st.act === "think") {
      px(31, 33 + o, 2, 2, "#b05a5a");
    } else {
      px(30, 34 + o, 4, 1, "#b05a5a");
    }

    // --- 前髪・横髪 ---
    px(15, 9 + o, 34, 7, cHair);
    px(14, 14 + o, 36, 4, cHair);
    px(14, 17 + o, 8, 6, cHair); 
    px(25, 17 + o, 14, 4, cHair); 
    px(42, 17 + o, 8, 6, cHair); 
    px(13, 18 + o, 5, 20, cHair); 
    px(46, 18 + o, 5, 20, cHair); 
    px(16, 12 + o, 8, 2, cHairLight);
    px(36, 12 + o, 11, 2, cHairLight);

    // --- 箱の手前（常に描画） ---
    px(6, 46, 52, 18, cBox);
    px(6, 46, 52, 2, cBoxShadow); 
    px(12, 48, 2, 16, cBoxShadow); 
    px(28, 48, 2, 16, cBoxShadow);
    px(44, 48, 2, 16, cBoxShadow);
    px(15, 43 + o, 7, 6, cSkin);
    px(42, 43 + o, 7, 6, cSkin);

    // --- アイテムのオーバーレイ（上から被せる） ---
    if (st.act === "pc") {
      px(16, 42, 32, 14, "#8a94a6"); // 画面枠
      px(18, 44, 28, 10, "#dce4f0"); // 画面
      px(14, 56, 36, 4, "#6b7588");  // キーボード部
      px(22, 54, 5, 4, cSkin);       // 左手
      px(37, 54, 5, 4, cSkin);       // 右手
    } else if (st.act === "book") {
      px(16, 46, 32, 12, "#4a69bd"); // 表紙
      px(18, 48, 28, 10, "#ffffff"); // ページ
      px(31, 48, 2, 10, "#e1e5ee");  // のど
      px(14, 50, 5, 6, cSkin);       // 左手
      px(45, 50, 5, 6, cSkin);       // 右手

      end:"次から次へと…ふふ、楽しいですわね。"}
  ];
  var ATTRT={
    "ロマンチック":function(n){return n+"…やっぱりコレですわ。コレなんですわ。"},
    "かっこいい":function(n){return n+"っぽくキメポーズ、ですわ。"},
    "かわいい":function(n){return n+"を思うだけで、頬がゆるんでしまいますの。"},
    "不思議":function(n){return n+"は、AIに聞いてもよくわかりませんでしたわ。"},
    "綺麗":function(n){return n+"…なんて綺麗なのでしょう。"},
    "大切":function(n){return n+"を、時々眺めてみるのですわ。"}
  };
  // 「あなた様にとって、(属性)ものは、何ですか？」— 属性ごとの言葉集めの質問
  var ASK_ADJ={"かわいい":"かわいい","ロマンチック":"ロマンチックな","かっこいい":"かっこいい","綺麗":"綺麗な","不思議":"不思議な","大切":"大切な"};
  var ASK_END={"かわいい":"なんて愛らしいのでしょう…ぎゅっとしたくなりますわ〜！","ロマンチック":"トキメキが止まりませんわ〜♡","かっこいい":"なんてかっこいいのでしょう！ 憧れてしまいますわ〜！","綺麗":"なんて綺麗なのでしょう…うっとりいたしますわ。","不思議":"なんて不思議なのでしょう…もっと知りたくなりますわ！","大切":"それほど大切なものなのですね…わたくしも、大切にいたしますわ。"};
  Object.keys(ASK_ADJ).forEach(function(a){ASKS.push({id:"g-"+a,attr:a,q:"あなた様にとって、"+ASK_ADJ[a]+"ものは、何ですか？",end:ASK_END[a]})});
  var CATCTX={food:"food",person:"person",animal:"animal",action:"action",thing:"thing",place:"place"};
  var tpend=null;
  function teachAsk(){
    var a=pick(ASKS);
    say(a.q,function(){showChoices({ask:a,use:[],key:"ask:"+a.id,y:"えーっとね",n:"教えない"})});
  }
  function openT(a){
    tpend=a;$("tqtext").textContent=(ASK_ADJ[a.attr]||a.attr+"な")+"ことばを教えてください。";$("tword").value="";$("tcat").value="";
    say("まあ、ぜひ、お聞かせくださいませ。",function(){$("tp").classList.add("on");$("tword").focus()});
  }
  function closeT(){$("tp").classList.remove("on");tpend=null}
  function submitT(){
    if(!tpend)return;
    var t=$("tword").value.trim(),c=$("tcat").value;
    if(!t){say("どのようなことばでしょうか。");return}
    if(!c){say("どのような種類のことばか、お選びくださいませ。");return}
    var a=tpend;closeT();stopIdle();
    var ck=catOf(c).ctx;add(t,ck);
    var w=words.filter(function(x){return x.text===t})[0];
    w.cat=c;w.attrs=w.attrs||[];if(w.attrs.indexOf(a.attr)<0)w.attrs.push(a.attr);
    save();render();joy();
    var lead=a.lead&&a.lead[ck]?a.lead[ck](t):(ck==="person"?t+"様…":t+"…");
    say(lead+a.end,function(){
      idleTimer=setTimeout(function(){if(catOf(c).norate)return;say(t+"ですわね！"+t+"はお好きでしょうか？",function(){showRate(w)})},800);
    });
  }

  var GOOD=["まあ、嬉しゅうございます。","ふふ、安心いたしました。","ありがとうございます。"],
      CLOSE=["それでは、またのちほど。","では、ひとまず失礼いたしますね。ごきげんよう。","本日はこのあたりで。ごきげんよう。"];
  function judge(d){
    var r=last;last=null;showFb(false);stopIdle();
    if(d>0){if(r&&r.ask){openT(r.ask);return}
      if(r&&r.learn){var L=r.learn;L.w.attrs=L.w.attrs||[];if(L.w.attrs.indexOf(L.attr)<0)L.w.attrs.push(L.attr);save();render()}
      joy();endTalk((r&&r.yr)||pick(GOOD));return}
    if(r){r.use.forEach(function(w){w.bad=w.bad||[];if(w.bad.indexOf(r.key)<0)w.bad.push(r.key)});
      if(!r.use.length&&r.key.indexOf("talk:")===0)badTalk.push(r.key.slice(5))}
    save();
    if(r&&r.learn){say((r&&r.nr)||"そうなんですね。",function(){showAttrChoices(r.learn)});return}   // 否定→正しい属性を選んでもらう
    endTalk((r&&r.nr)||"そうなんですね。");
  }
  function showAttrChoices(L){
    var box=$("attr");box.innerHTML="";
    SLOT.t.d.filter(function(a){return a!==L.attr}).forEach(function(a){   // 外れた属性は除く
      var b=document.createElement("button");b.textContent=a;
      b.onclick=function(){pickAttr(L.w,a)};box.appendChild(b);
    });
    var o=document.createElement("button");o.textContent="どれでもないよ";
    o.onclick=function(){box.classList.remove("on");endTalk("そうなんですね。")};box.appendChild(o);
    box.classList.add("on");
  }
  function pickAttr(w,a){
    $("attr").classList.remove("on");stopIdle();
    w.attrs=w.attrs||[];if(w.attrs.indexOf(a)<0)w.attrs.push(a);
    save();render();joy();
    endTalk("なるほど、"+w.text+"は「"+a+"」なのですね。覚えましたわ。");
  }
  function endTalk(first){ // 相槌への反応 → お別れの挨拶 → 独り言モード
    say(first,function(){
      idleTimer=setTimeout(function(){say(byeFull(),function(){startIdle(7000)})},900);
    });
  }
  function nope(){endTalk("そうなんですね。")}

  $("teach").onclick=function(){
    stopIdle();
    teach();
  };
  $("tgo").onclick=submitT;
  $("tcancel").onclick=function(){closeT();stopIdle();nope()};
  $("ansgo").onclick=answer;
  $("pass").onclick=function(){stopIdle();if(pend){asked.push(pend.id);save()}closeQ();say("さようでございますか。また、お聞かせくださいませ。")};
  $("speak").onclick=function(){
    stopIdle();
    speak();
  };
  $("ask").onclick=function(){
    stopIdle();
    ask()
  };
  girl.onclick=function(){
    stopIdle();
    speak()
  };
  girl.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      stopIdle();
      speak();
    }
  });
  $("yes").onclick=function(){judge(1)};
  $("no").onclick=function(){judge(-1)};

  // ---------- 端末をまたぐ「引き継ぎコード」 ----------
  function xmsg(t){$("xmsg").textContent=t}
  function encodeData(){return "KP1:"+btoa(unescape(encodeURIComponent(JSON.stringify({words:words,asked:asked,trophies:trophies}))))}
  function cleanWord(x){
    if(!x||typeof x.text!=="string"||!x.text.trim()||x.text.length>60)return null;
    var strs=function(a){return Array.isArray(a)?a.filter(function(s){return typeof s==="string"&&s.length<40}).slice(0,40):[]};
    var w={text:x.text.trim(),ctx:strs(x.ctx),bad:strs(x.bad),attrs:strs(x.attrs).map(function(a){return a==="ふしぎ"?"不思議":a}).filter(function(a){return ATTRT[a]})};
    if(!w.ctx.length)w.ctx=["free"];
    if(CATS.some(function(c){return c.id===x.cat}))w.cat=x.cat;else fixCat(w);
    if(x.like>=1&&x.like<=5)w.like=Math.round(x.like);
    return w;
  }
  function decodeData(s){
    s=(s||"").replace(/\s+/g,"");
    if(s.indexOf("KP1:")!==0)throw new Error("format");
    var o=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
    if(!o||!Array.isArray(o.words))throw new Error("format");
    return {words:o.words.slice(0,2000).map(cleanWord).filter(Boolean),asked:Array.isArray(o.asked)?o.asked.filter(function(a){return typeof a==="string"}):[],trophies:Array.isArray(o.trophies)?o.trophies.filter(function(id){return TROPHIES.some(function(t){return t.id===id})}):[]};
  }
  function importData(replace){
    var d;
    try{d=decodeData($("xcode").value)}catch(e){xmsg("読み込めませんでした。引き継ぎコード（KP1:で始まる文字列）を、すべて貼り付けてください。");return}
    stopIdle();
    if(replace){words=[];asked=[]}
    d.words.forEach(function(x){
      var ex=words.filter(function(w){return w.text===x.text})[0];
      if(!ex){words.push(x);return}
      x.ctx.forEach(function(c){if(ex.ctx.indexOf(c)<0)ex.ctx.push(c)});
      x.attrs.forEach(function(a){if((ex.attrs=ex.attrs||[]).indexOf(a)<0)ex.attrs.push(a)});
      if(!ex.cat&&x.cat)ex.cat=x.cat;
      if(!ex.like&&x.like)ex.like=x.like;
    });
    d.asked.forEach(function(a){if(asked.indexOf(a)<0)asked.push(a)});
    d.trophies.forEach(function(id){if(trophies.indexOf(id)<0)trophies.push(id)});
    save();render();joy();
    xmsg(d.words.length+"個のことばを"+(replace?"置き換えて":"統合して")+"読み込みました。");
    say("まあ…"+d.words.length+"個のことばを、受け取りました。大切にいたしますわ。");
  }
  $("xport").onclick=function(){
    $("xcode").value=encodeData();$("xcode").select();
    xmsg(words.length+"個のことばを書き出しました。コピーして、別の端末の同じページに貼り付けてください。");
  };
  $("xcopy").onclick=function(){
    var t=$("xcode").value||encodeData();$("xcode").value=t;
    var ok=function(){xmsg("コピーしました。")},ng=function(){$("xcode").select();xmsg("自動コピーできませんでした。選択された文字列を、長押し・右クリックなどでコピーしてください。")};
    try{navigator.clipboard.writeText(t).then(ok,ng)}catch(e){ng()}
  };
  $("xmerge").onclick=function(){importData(false)};
  $("xrep").onclick=function(){importData(true)};

  // 吹き出しは自由にスクロール可。ユーザーが触ったら自動追従をやめ、一番下に戻したら再開する
  (function(){
    var bt=$("btext");
    ["wheel","touchstart","pointerdown","keydown"].forEach(function(ev){bt.addEventListener(ev,function(){userScroll=true},{passive:true})});
    bt.addEventListener("scroll",function(){if(userScroll&&bt.scrollHeight-bt.clientHeight-bt.scrollTop<3)userScroll=false});
  })();
  // 吹き出しと重ならないよう、ドット絵は整数倍で枠に収まる最大サイズにする
  function fit(){
    var s=$("stage");if(!s)return;
    var k=Math.floor(Math.min((s.clientWidth-136)/64,s.clientHeight/64)*4)/4;   // 0.25刻み＝表示サイズは常に整数px
    k=Math.max(1,Math.min(k,4.5));
    girl.style.width=64*k+"px";girl.style.height=64*k+"px";
  }
  window.addEventListener("resize",fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe($("stage"));
  fit();

  // ================= 小道具・トロフィー・ことばずかん =================
  var LIKE_NAMES={5:"大好き",4:"好き",3:"普通",2:"嫌い",1:"大嫌い"};
  function trophySVG(color){
    return '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 3h10v4a5 5 0 0 1-10 0z" fill="'+color+'" stroke="#5a4a3a" stroke-width="1"/><path d="M7 4H3.5v2A4 4 0 0 0 7 10M17 4h3.5v2A4 4 0 0 1 17 10" fill="none" stroke="'+color+'" stroke-width="1.6"/><rect x="10.5" y="11.5" width="3" height="4.5" fill="'+color+'" stroke="#5a4a3a" stroke-width=".8"/><rect x="7" y="17" width="10" height="3.2" rx="1" fill="'+color+'" stroke="#5a4a3a" stroke-width=".8"/></svg>';
  }
  // --- お知らせ（トロフィー・飾りの追加）---
  var toastQ=[],toastBusy=false;
  function toast(html){toastQ.push(html);if(!toastBusy)nextToast()}
  function nextToast(){
    var h=toastQ.shift(),t=$("toast");
    if(!h){toastBusy=false;t.hidden=true;return}
    toastBusy=true;t.innerHTML=h;t.hidden=false;t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");
    setTimeout(nextToast,3600);
  }
  // --- トロフィー：覚えた言葉が10・50・100個 ---
  function checkTrophy(){
    TROPHIES.forEach(function(t){
      if(words.length>=t.n&&trophies.indexOf(t.id)<0){
        trophies.push(t.id);save();joy();
        toast('<span class="tr">'+trophySVG(t.color)+'</span><b>トロフィーを獲得しました！</b><small>'+t.label+'トロフィー（覚えた言葉 '+t.n+'語）</small>');
      }
    });
  }
  // --- 小道具：覚えた言葉5つにつき1つ、部屋に増える（本棚→スローガン→メモ の順）---
  // --- 本棚：覚えた言葉5つにつき本が1冊増える。獲得したトロフィーも棚に飾る ---
  var propCount=-1;
  var BOOK_COLS=["#b55a4a","#4f7cac","#6a9a5b","#c9983a","#8a6bb0","#3f8f8a","#b0587e","#6b7f3a"];
  function renderProps(){
    var box=$("props"),n=Math.floor(words.length/5);
    box.textContent="";
    var shelf=mk("div","","prop shelf");
    TROPHIES.forEach(function(t){                       // 獲得したトロフィー（棚の左端）
      if(trophies.indexOf(t.id)>-1){var s=mk("span","","tr");s.innerHTML=trophySVG(t.color);s.title=t.label+"トロフィー";shelf.appendChild(s)}
    });
    var titles=[];
    for(var i=0;i<n;i++){                               // 5語につき1冊：背表紙には、その5語のうち最も好きな言葉
      var g=words.slice(i*5,i*5+5),best=g[g.length-1];
      g.forEach(function(w){if((w.like||0)>(best.like||0))best=w});
      var bk=mk("span",best.text,"book");
      bk.style.background=BOOK_COLS[i%BOOK_COLS.length];
      bk.style.height=(54+(i*7)%9)+"px";
      bk.title=g.map(function(w){return w.text}).join("・");
      if(propCount>=0&&i>=propCount)bk.classList.add("pop");
      shelf.appendChild(bk);titles.push(best.text);
    }
    var tn=TROPHIES.filter(function(t){return trophies.indexOf(t.id)>-1}).map(function(t){return t.label+"トロフィー"});
    shelf.setAttribute("role","img");
    shelf.setAttribute("aria-label","本棚："+(tn.length?tn.join("、")+"、":"")+(titles.length?titles.join("、"):"本はまだありません"));
    box.appendChild(shelf);
    if(propCount>=0&&n>propCount){
      toast('<b>本棚に本が増えました</b><small>覚えた言葉 '+words.length+'語（'+n+'冊）</small>');
      if(box.scrollTo)box.scrollTo({left:box.scrollWidth,behavior:"smooth"});
    }
    propCount=n;
  }
  // --- ことばずかん：カテゴリーごとに分類して表示し、その場で訂正できる ---
  var zOpen=false,zEdit=null,zFocus=null;
  function openZukan(){stopIdle();zOpen=true;zEdit=null;zFocus=document.activeElement;$("zukan").hidden=false;document.body.style.overflow="hidden";renderZukan();$("zclose").focus()}
  function closeZukan(){zOpen=false;zEdit=null;$("zukan").hidden=true;document.body.style.overflow="";if(zFocus&&zFocus.focus)zFocus.focus();startIdle(5000)}
  function renderZukan(){
    var body=$("zbody");body.textContent="";
    var by={},unk=[];
    words.forEach(function(w){if(w.cat&&catOf0(w.cat))(by[w.cat]=by[w.cat]||[]).push(w);else unk.push(w)});
    var filled=CATS.filter(function(c){return by[c.id]}).length;
    $("zsum").textContent="覚えたことば "+words.length+"語 ／ "+CATS.length+"カテゴリーのうち "+filled+"つで登場";
    var tr=$("ztro");tr.textContent="";
    TROPHIES.forEach(function(t){
      var on=trophies.indexOf(t.id)>-1,s=mk("span","","ztr"+(on?"":" off"));
      s.innerHTML=trophySVG(on?t.color:"#9aa0aa");s.appendChild(mk("small",on?t.label:t.n+"語で"));tr.appendChild(s);
    });
    function group(label,arr){
      var sec=mk("section","","zsec");sec.appendChild(mk("h3",label+"（"+arr.length+"）"));
      var ul=mk("ul","","zlist");
      arr.forEach(function(w){
        var li=mk("li");
        if(zEdit===w){buildEditor(li,w,function(){zEdit=null});ul.appendChild(li);return}
        li.appendChild(document.createTextNode(w.text+" "));
        if(w.attrs&&w.attrs.length)li.appendChild(mk("small","（"+w.attrs.join("・")+"）"));
        if(w.like)li.appendChild(mk("small","［"+LIKE_NAMES[w.like]+"］"));
        var eb=mk("button","訂正"),xb=mk("button","×");
        eb.setAttribute("aria-label",w.text+"を訂正する");xb.setAttribute("aria-label",w.text+"をわすれさせる");
        eb.onclick=function(){zEdit=w;renderZukan()};
        xb.onclick=function(){words.splice(words.indexOf(w),1);save();render();say("「"+w.text+"」…あら、何でしたかしら。")};
        li.appendChild(eb);li.appendChild(xb);ul.appendChild(li);
      });
      sec.appendChild(ul);body.appendChild(sec);
    }
    if(!words.length)body.appendChild(mk("p","まだ、ことばを存じません…","hint"));
    CATS.forEach(function(c){if(by[c.id])group(c.label,by[c.id])});
    if(unk.length)group("未分類（種類はおまかせ）",unk);
    var empty=CATS.filter(function(c){return !by[c.id]}).map(function(c){return c.label});
    if(empty.length)body.appendChild(mk("p","まだ空のカテゴリー："+empty.join("、"),"hint"));
  }
  $("zukanBtn").onclick=openZukan;
  $("zclose").onclick=closeZukan;
  $("zukan").addEventListener("click",function(e){if(e.target===this)closeZukan()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&zOpen)closeZukan()});

  draw();render();stopIdle();
  ["pointerdown","keydown","input","focusin"].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(st.act!=="normal")stopIdle();       // アニメ中の操作は即中断
      else if(idleTimer)startIdle(5000);     // 操作中は次のアニメ開始を先送り
    },true);
  });
  say(words.length?"…おかえりなさいませ。本日も、お話しいたしましょう。":"…はじめまして。わたくし、箱の中におります。どうぞ、ことばを教えてくださいませ。");
})();
</script>
</body>
</html>
